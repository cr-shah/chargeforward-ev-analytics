[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chargeforward"
version = "0.1.0"
description = "Washington EV registration analytics and evaluated forecasts"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3", "statsmodels>=0.14"]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20", "folium>=0.16", "streamlit-folium>=0.20"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
viz = ["matplotlib>=3.8"]
test = ["pytest>=8", "httpx>=0.27"]
cloud = ["boto3>=1.34", "prefect>=3.0,<4", "snowflake-connector-python[pandas]>=3.12"]

[project.scripts]
chargeforward = "chargeforward.pipeline:main"
chargeforward-flow = "flows.chargeforward_pipeline:main"

[tool.setuptools.packages.find]
include = ["chargeforward*", "flows*"]
